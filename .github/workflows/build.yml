name: Build Nereides Engine2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    # 창 모드가 실수로 실행되어 멈춰도 작업이 끝나도록 시간 제한을 둔다.
    timeout-minutes: 20
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Visual Studio solution
        run: msbuild NereidesEngine2.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
      - name: Run input and time demo
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe --demo
      - name: Verify object lifetime boundaries
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe --lifecycle-tests
      - name: Verify input and time boundaries
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe --input-time-tests
      - name: Verify window message translation
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe --window-tests
      - name: Verify render data without a GPU
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe --render-tests
