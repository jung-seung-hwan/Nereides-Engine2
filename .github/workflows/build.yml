name: Build Nereides Engine2

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Visual Studio solution
        run: msbuild NereidesEngine2.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
      - name: Run object lifetime demo
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe
      - name: Verify object lifetime boundaries
        run: ./bin/x64/${{ matrix.configuration }}/NereidesEngine2.exe --lifecycle-tests
